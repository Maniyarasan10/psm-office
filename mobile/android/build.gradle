// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// CMake can invoke clang++.exe through its 8.3 short name (CLANG_~1.EXE) when
// paths contain spaces. The driver then falls back to C mode and does not
// auto-link libc++, producing undefined std::__ndk1 symbols. Pass the STL
// explicitly to every native Android module.
subprojects { subproject ->
  ["com.android.application", "com.android.library"].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      subproject.android {
        defaultConfig {
          externalNativeBuild {
            cmake {
              arguments "-DCMAKE_CXX_FLAGS=-stdlib=libc++",
                "-DCMAKE_CXX_STANDARD_LIBRARIES=-lc++ -latomic -lm"
            }
          }
        }
      }
    }
  }
}
