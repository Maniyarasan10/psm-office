# Root Netlify config.
#
# The Vite app lives in ./frontend, but Netlify publishes the repository root by
# default (no index.html there => "Page not found" on every route). This file
# makes the root a valid build context: it builds ./frontend and publishes
# ./frontend/dist as the site root.
#
# If the Netlify site's "base directory" is set to "frontend" in the UI, Netlify
# ignores this file and uses ./frontend/netlify.toml instead (same result).

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Same-origin API: the panel calls /api/* (VITE_API_URL=/api) and Netlify
# forwards those calls to the API host. These rules MUST come before the SPA
# fallback: Netlify uses the first matching redirect, so "/*" would otherwise
# swallow /api/* and return index.html (which makes login fail).
[[redirects]]
  from = "/api/*"
  to = "https://psm-office-api-84c884d6ab34.herokuapp.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://psm-office-api-84c884d6ab34.herokuapp.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback: every client-side route (login, dashboard, employees, ...)
# is served by index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed build assets forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images (ce.png / fin.png / logo.png).
[[headers]]
  for = "/ce.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fin.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
