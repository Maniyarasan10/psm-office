[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback: all client-side routes (login, dashboard, employees, ...)
# are served by index.html so React Router handles them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed build assets forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ce.png / logo.png are static, cache for a day.
[[headers]]
  for = "/ce.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
